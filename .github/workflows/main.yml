name: Auto Create and Merge PR

# Trigger when code is pushed to ANY branch EXCEPT main
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch: # Allows you to run this manually if needed

# Grant the background token permission to manipulate Pull Requests
permissions:
  contents: write
  pull-requests: write

jobs:
  create-and-merge-pr:
    name: Auto-Merge ServiceNow Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so origin/main is visible to Git

      - name: Auto-Create and Auto-Merge PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Create the PR and capture the URL dynamically using the triggering branch name
          PR_URL=$(gh pr create --base main --head "${{ github.ref_name }}" --title "Automated PR: ${{ github.ref_name }}" --body "This PR was automatically created and merged from the ServiceNow UI Action.")
          
          echo "Created PR: $PR_URL"
          
          # 2. Give GitHub a moment to register the new PR before trying to merge it
          sleep 2

          # 3. Merge the PR and delete the temporary branch
          gh pr merge "$PR_URL" --merge --delete-branch
