name: Auto Create & Merge PR

on:
  push:
    branches-ignore:
      - main                    # fires on any SN branch commit

jobs:
  create-and-merge-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}    # ← dynamically picks whatever branch SN pushed to
          base: main
          title: "Auto PR: ServiceNow changes from ${{ github.ref_name }}"
          body: "Triggered by ServiceNow Studio commit — ${{ github.sha }}"

      - name: Auto Merge PR
        if: steps.create_pr.outputs.pull-request-number != ''
        run: |
          gh pr merge ${{ steps.create_pr.outputs.pull-request-number }} \
            --auto --merge \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
